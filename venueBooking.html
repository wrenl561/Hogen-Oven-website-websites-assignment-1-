<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Venue Booking</title>

    <link rel="stylesheet" href="styles.css" type="text/css">

    <!-- JQUERY -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

</head>

<body>

    <!-- BOOKING SECTION -->
    <section class="booking-page">

        <div class="booking-card">

            <h1>🧁 Book a venue 🍩</h1>

            <p>
                Fill in the form below and we will contact you soon!
            </p>

            <form 
                id="booking"
                name="bookingForm"
            >

                <!-- NAME -->
                <div class="form-group">

                    <input
                        type="text"
                        id="name"
                        name="customerName"
                        placeholder="Name"
                    >

                </div>


                <!-- EMAIL -->
                <div class="form-group">

                    <input
                        type="text"
                        id="email"
                        name="email"
                        placeholder="Email"
                    >

                </div>


                <!-- DATE -->
                <div class="form-group">

                    <input
                        type="date"
                        id="date"
                        name="date"
                    >

                </div>


                <!-- DETAILS -->
                <div class="form-group">

                    <textarea
                        rows="6"
                        id="details"
                        name="details"
                        placeholder="Details"
                    ></textarea>

                </div>


                <!-- BUTTON -->
                <div class="submit-wrap">

                    <input
                        type="submit"
                        value="Send"
                        id="submit"
                    >

                </div>

            </form>

        </div>

    </section>


<!-- JQUERY -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<!-- EXTERNAL JS -->
<script src="venueBooking.js"></script>

</body>
</html>
