<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF=8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
</head>

<body>
    <!-- NAV -->
  <nav>
    <nav>
    <a class="nav-logo" href="index.html">
      <img src="logo.png" alt="nav-logo">
    </a>

    <div class="nav-links">
        <a href="items.html">Menu</a>
    </div>
  </nav>

    <!-- CHECKOUT SECTION -->
    <section class="checkout-container">

        <div class="checkout-form">
            <h1>Checkout</h1>

            <form id="payment-form" onsubmit="event.preventDefault()">

                <h2>Customer Details</h2>

                <label for="fullname">Full Name</label>
                <input type="text" id="fullname">

                <label for="email">Email Address</label>
                <input type="email" id="email">

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone">

                <label for="address">Delivery Address</label>
                <textarea id="address" rows="4"></textarea>

                <h2>Payment Details</h2>

                <label for="cardname">Cardholder Name</label>
                <input type="text" id="cardname">

                <label for="cardnumber">Card Number</label>
                <input type="text" id="cardnumber" maxlength="16">

                <div class="payment-row">

                    <div>
                        <label for="expiry">Expiry Date</label>
                        <input type="text" id="expiry" placeholder="MM/YY">
                    </div>

                    <div>
                        <label for="cvv">CVV</label>
                        <input type="password" id="cvv" maxlength="3">
                    </div>

                </div>

                <button type="submit" class="pay-btn">
                    Complete Payment
                </button>

            </form>
        </div>
        
        <!-- ORDER SUMMARY -->
        <aside class="order-summary">
            <h2>Order Summary</h2>

            <ul id="summary-items">
                <li>
                    <span>Traditional Cornish Pasty</span>
                    <span>&pound;4.00</span>
                </li>

                <li>
                    <span>Strawberry Cupcake</span>
                    <span>£3.00</span>
                </li>
            </ul>

            <div class="summary-total">
                <strong>Total</strong>
                <strong>£7.00</strong>
            </div>
        </aside>

    </section>

    <script>
        function validateForm(event) {

            event.preventDefault(); // STOP page refresh

            var name = document.getElementById('fullname');
            var email = document.getElementById('email');
            var phone = document.getElementById('phone');
            var address = document.getElementById('address');
            var cardName = document.getElementById('cardname');
            var cardNumber = document.getElementById('cardnumber');
            var expiryDate = document.getElementById('expiry');
            var cvv = document.getElementById('cvv');

            var validFlag = true;

            if (name.value == "") {
                $("#fullname").addClass("error");
                validFlag = false;
            }
            else {
                $("#fullname").removeClass("error");
            }

            if (email.value == "") {
                $("#email").addClass("error");
                validFlag = false;
            }
            else {
                $("#email").removeClass("error");
            }

            if (phone.value == "") {
                $("#phone").addClass("error");
                validFlag = false;
            }
            else {
                $("#phone").removeClass("error");
            }
        
            if (address.value == "") {
                $("#address").addClass("error");
                validFlag = false;
            }
            else {
                $("#address").removeClass("error");
            }

            if (cardName.value == "") {
                $("#cardname").addClass("error");
                validFlag = false;
            }
            else {
                $("#cardname").removeClass("error");
            }

            if (cardNumber.value == "") {
                $("#cardnumber").addClass("error");
                validFlag = false;
            }
            else {
                $("#cardnumber").removeClass("error");
            }

            if (expiry.value == "") {
                $("#expiry").addClass("error");
                validFlag = false;
            }
            else {
                $("#expiry").removeClass("error");
            }

            if (cvv.value == "") {
                $("#cvv").addClass("error");
                validFlag = false;
            }
            else {
                $("#cvv").removeClass("error");
            }

            if (validFlag) {
                alert("Form submitted!");
            }
        }

        function init() {
            document
                .getElementById('payment-form')
                .addEventListener('submit', validateForm);

        }

        window.onload = init;
    </script>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 Hogen Oven. All rights reserved.</p>
    </footer>
</body>
</html>
